# XDK 4721 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (TimeSplitters 2, NTSC) code at the address given; the device is laid out as 4831's at every offset checked.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at; its miniport is at +0x23C0 (the device init 0x1E231B)
CDevice_Push              = 0x0    # D3DDevice_SetTexture 0x1DB732 reads it, compares with +4, calls MakeSpace 0x1E0290
CDevice_PushThreshold     = 0x4    # D3DDevice_SetTexture 0x1DB734 compares the push pointer with it
CDevice_BaseVertex        = 0x1C   # 4831's: the title never calls SetIndices, so no code of it reads or writes this
CDevice_IndexBuffer       = 0x38C  # the device teardown 0x1E233E releases it
CDevice_ZScale            = 0x510  # D3DDevice_GetViewportOffsetAndScale 0x1DC0C5 scales the Z range by it
CDevice_SuperSampleX      = 0x518  # D3DDevice_GetViewportOffsetAndScale 0x1DC01E scales viewport X by it
CDevice_SuperSampleY      = 0x51C  # D3DDevice_GetViewportOffsetAndScale 0x1DC040 scales viewport Y by it
CDevice_Transforms        = 0x810  # D3DDevice_SetTransform 0x1DAE46 copies 16 dwords to +0x810 + type * 64
CDevice_Textures          = 0xB38  # D3DDevice_SetTexture 0x1DB6F0 reads, 0x1DB729 stores [stage]
CDevice_Palettes          = 0xB48  # the device teardown 0x1E2364 releases [stage], 16 bytes past the texture
CDevice_RenderTarget      = 0x21B4 # D3D_CommonSetRenderTarget 0x1DD0E2 stores it, D3DDevice_SetViewport 0x1DB58A reads it
CDevice_Depth             = 0x21B8 # D3D_CommonSetRenderTarget 0x1DD10B stores it, D3DDevice_Clear 0x1DAA2B reads it
CDevice_BackBuffer        = 0x21C0 # D3DDevice_GetBackBuffer2 0x1DB1E0 returns it for index 0
CDevice_FrontBuffer       = 0x21C4 # D3DDevice_GetBackBuffer2 0x1DB1C5 returns it for index -1
CDevice_SwapCount         = 0x2C10 # D3DDevice_Swap 0x1DF050 increments it, 0x1DF0C1 returns it
CDevice_Size              = 0x2C30 # Direct3D_CreateDevice 0x1DDACB clears 0xB0C dwords of the device on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x1DDA8E ors BehaviorFlags & 0x10 into it, D3DDevice_SetPixelShader 0x1DF6E1 tests that bit
CDevice_Time              = 0x30   # D3D_SetFence 0x1DFF3D reads it, 0x1DFFB3 adds 2
CDevice_PixelShader       = 0x370  # D3DDevice_SetPixelShader 0x1DF618 stores the handle
CDevice_VertexShader      = 0x380  # the device init 0x1E21E8 stores the FVF shader object 0x1EC0C8, D3DDevice_SetVertexShader 0x1DE4F8 the current one
CDevice_BackBufferScale   = 0x528  # the frame buffer init 0x1E191B stores the X scale as a float, 0x1E1934 the Y scale at +4
CDevice_Viewport          = 0xA90  # D3DDevice_SetViewport 0x1DB67B to 0x1DB69F stores X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0xAA8  # D3DDevice_SetScreenSpaceOffset 0x1DBC13 stores x + 0.53125, 0x1DBC23 y + 0.53125 at +4
CDevice_AutoDepth         = 0x21CC # the frame buffer init 0x1E19E2 stores the depth buffer, D3D_InitDefaultState 0x1E16C0 reads it
CDevice_VBlankCallback    = 0x2550 # D3DDevice_SetVerticalBlankCallback 0x1DAFCA stores it, the vertical blank handler 0x1E2A6E calls [miniport + 0x190]
CDevice_VBlankEvent       = 0x2554 # D3DDevice_BlockUntilVerticalBlank 0x1DAFFD waits on it, 0x1DAFEB clears its SignalState
CDevice_DisplayFlags      = 0x2574 # the vertical blank handler 0x1E2A0D tests miniport + 0x1B4
CDevice_VBlankCount       = 0x2580 # the vertical blank handler 0x1E29C4 to 0x1E29D1 increments miniport + 0x1C0
CDevice_Field             = 0x2590 # the vertical blank handler 0x1E2A34 stores the field at miniport + 0x1D0
CDevice_GammaRamps        = 0x259C # the flip handler 0x1E2944 loads miniport + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x2B9C # the flip handler 0x1E2934 tests [miniport + 0x7DC + index * 4], 0x1E2953 clears it
# D3D8 globals
DirtyFlags_Texture        = 0x4800 # D3DDevice_SetTexture 0x1DB765 ors it into D3D__DirtyFlags
TextureState_Stage        = 32     # D3DDevice_SetTextureStageStateNotInline 0x1DC9EB: [stage * 32 + type] dwords
Stream_Size               = 12     # D3DDevice_SetStreamSource 0x1DE08A indexes the stream table by n * 12
Stream_Stride             = 0x0    # D3DDevice_SetStreamSource 0x1DE0D2 stores Stride
Stream_Buffer             = 0x8    # D3DDevice_SetStreamSource 0x1DE0D8 stores the vertex buffer
PixelShader_Definition    = 0x8    # D3DDevice_SetPixelShader 0x1DF680 reads the definition pointer
# DSOUND
CDirectSoundStream_Vtable  = 0x0   # CDirectSoundStream constructor 0x1FFF04 stores the first vtable
CDirectSoundStream_Vtable2 = 0x4   # CDirectSoundStream constructor 0x1FFEFD stores the second vtable
EffectsImage_Skip0         = 0x804 # 0x201CAA (reached from CDirectSound_DownloadEffectsImage 0x1FE8AD) adds this dword count
EffectsImage_Skip1         = 0x80C # 0x201CA4 loads this dword count
EffectsImage_Desc          = 0x818 # 0x201CB3: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current               = 0x0    # XGetDeviceChanges 0x214F60 reads it
XPP_Changed               = 0x4    # XGetDeviceChanges 0x214F3F tests it, 0x214F80 clears it
XPP_Previous              = 0x8    # XGetDeviceChanges 0x214F84 copies Current into it
